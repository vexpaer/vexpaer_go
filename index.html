<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤣👉</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22white%22>v</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-layout">
        <div class="links-area">
            <div class="wrap" id="links-container">
                <!-- 动态生成的标签将渲染在此处 -->
            </div>
        </div>

        <aside class="right-panel">
            <div class="right-resize-handle" id="right-resize-handle" title="拖动调整宽度"></div>
            <div class="info-panel">
                <div class="info-time" id="info-time">--:--:--</div>
                <div class="info-poem" id="info-poem">诗词加载中...</div>
                <div class="expander-row">
                    <button id="toggle-todo" class="expander-btn" onclick="toggleFeature('todo')">展开待办</button>
                    <button id="toggle-prompts" class="expander-btn" onclick="toggleFeature('prompts')">展开提示词</button>
                </div>
            </div>

            <div class="feature-panel">
                <div id="feature-todo" class="feature-content">
                    <h3 class="feature-title">待办事项</h3>
                    <div class="feature-input-row">
                        <input id="todo-input" type="text" placeholder="输入待办事项，回车或点击添加">
                        <button onclick="addItem('todo')">添加</button>
                    </div>
                    <ul id="todo-list" class="item-list"></ul>
                </div>

                <div id="feature-prompts" class="feature-content">
                    <h3 class="feature-title">提示词记录</h3>
                    <div class="feature-input-row">
                        <input id="prompts-input" type="text" placeholder="输入提示词，回车或点击添加">
                        <button onclick="addItem('prompts')">添加</button>
                    </div>
                    <ul id="prompts-list" class="item-list"></ul>
                </div>
            </div>
        </aside>
    </div>

    <!-- 悬浮打开设置的按钮 -->
    <button id="settings-btn" onclick="openSettings()" title="编辑页面配置">⚙️</button>

    <!-- 设置模态框 -->
    <div id="settings-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeSettings()">&times;</span>
            
            <h2 style="margin-top:0;">系统设置与标签编辑</h2>
            
            <div class="controls">
                <button class="btn-success" onclick="exportJson()">⬇️ 导出 JSON</button>
                <button class="btn-success" onclick="document.getElementById('import-file').click()">⬆️ 导入 JSON</button>
                <input type="file" id="import-file" style="display:none" accept=".json" onchange="importJson(event)">
            </div>

            <h2 class="section-title">🎨 颜色管理</h2>
            <div id="color-editor"></div>

            <h2 class="section-title">📝 每日诗词样式</h2>
            <div id="poem-style-editor"></div>

            <h2 class="section-title">⏰ 定时提醒</h2>
            <div id="reminder-editor"></div>

            <h2 class="section-title">📍 栏目管理 (竖列)</h2>
            <div id="col-editor"></div>

            <h2 class="section-title">🏷️ 标签管理</h2>
            <div id="link-editor"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
